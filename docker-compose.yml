services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB=${PLATES_DATABASE}
      - POSTGRES_USER=${PLATES_USER}
      - POSTGRES_PASSWORD=${PLATES_PASSWORD}
    container_name: postgres_db_plates
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres_network

volumes:
  postgres_data:

networks:
  postgres_network:
